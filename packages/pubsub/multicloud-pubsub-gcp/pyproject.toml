[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-pubsub-gcp"
version = "0.1.4"
description = "Google Cloud Pub/Sub provider for multicloud-pubsub."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-pubsub>=0.1.4",
    "google-cloud-pubsub>=2.0.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[project.entry-points."multicloud.pubsub.topic.providers"]
gcp = "multicloud.pubsub.pubsub_gcp"

[project.entry-points."multicloud.pubsub.subscription.providers"]
gcp = "multicloud.pubsub.pubsub_gcp"

[tool.setuptools.packages.find]
include = ["multicloud*"]
