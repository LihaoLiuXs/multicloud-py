[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-blob"
version = "0.1.4"
description = "Cloud-agnostic blob storage client for the python-multicloud SDK. Pair with a provider package (multicloud-blob-aws / -gcp / -alibaba) for actual cloud calls."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-common>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[tool.setuptools.packages.find]
include = ["multicloud*"]

# multicloud/ and multicloud/blob/ are PEP 420 implicit namespace packages
# (no __init__.py at multicloud/ or multicloud/blob/) so the provider
# distributions (multicloud-blob-aws / -gcp / -alibaba) can drop their
# subpackages alongside blob_client/ at install time. Only blob_client/
# itself is a concrete leaf owned by THIS distribution.
