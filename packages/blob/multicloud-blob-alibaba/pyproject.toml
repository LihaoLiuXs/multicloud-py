[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-blob-alibaba"
version = "0.1.4"
description = "Alibaba Cloud OSS provider for multicloud-blob (placeholder; implementation pending)."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-blob>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[project.entry-points."multicloud.blob.providers"]
alibaba = "multicloud.blob.blob_ali"

[tool.setuptools.packages.find]
include = ["multicloud*"]
