[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-blob-gcp"
version = "0.1.4"
description = "Google Cloud Storage provider for multicloud-blob."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-blob>=0.1.4",
    "sfdc-multicloud-gcp-common>=0.1.4",
    "google-cloud-storage>=2.14.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]
async = ["gcloud-aio-storage>=9.0.0", "aiohttp>=3.14.1"]

[project.entry-points."multicloud.blob.providers"]
gcp = "multicloud.blob.blob_gcp"

[project.entry-points."multicloud.blob.async_providers"]
gcp = "multicloud.blob.blob_gcp.async_blob"

[tool.setuptools.packages.find]
include = ["multicloud*"]
