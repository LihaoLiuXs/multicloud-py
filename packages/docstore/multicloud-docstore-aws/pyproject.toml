[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-docstore-aws"
version = "0.1.4"
description = "AWS DynamoDB provider for multicloud-docstore."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-docstore>=0.1.4",
    "sfdc-multicloud-aws-common>=0.1.4",
    "boto3>=1.18.0",
    "botocore>=1.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

# The docstore client discovers providers by importing every module
# advertised under the ``multicloud.docstore.providers`` entry-point
# group. Importing this module triggers the
# ``@DOCSTORE_REGISTRY.register("aws")`` decorator on AwsDocStore,
# registering it.
[project.entry-points."multicloud.docstore.providers"]
aws = "multicloud.docstore.docstore_aws"

[tool.setuptools.packages.find]
include = ["multicloud*"]
