[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-multicloud-iam"
version = "0.1.4"
description = "Cloud-agnostic IAM identity management client for the python-multicloud SDK. Pair with a provider package (multicloud-iam-aws / -gcp) for actual cloud calls."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfdc-multicloud-common>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "mypy>=1.0.0"]

[tool.setuptools.packages.find]
include = ["multicloud*"]
